name: Sync OpenF1 Data

on:
  schedule:
    # Weekly Monday 12:00 UTC (post-Grand Prix weekend)
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      year:
        description: "Optional single season year to sync/replace (e.g. 2026)"
        required: false
        type: string
      from_year:
        description: "Optional start year for full OpenF1 rebuild (e.g. 2023)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-openf1-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OpenF1 incremental sync
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_FROM_YEAR: ${{ inputs.from_year }}
        run: |
          ARGS=("--summary-file" "/tmp/sync_summary.md")
          if [ -n "$INPUT_FROM_YEAR" ]; then
            ARGS+=("--from-year" "$INPUT_FROM_YEAR")
          elif [ -n "$INPUT_YEAR" ]; then
            ARGS+=("--year" "$INPUT_YEAR")
          fi
          python -m src.pipeline.sync "${ARGS[@]}"

      - name: Validate datasets and unit tests
        run: python -m pytest tests/ -v

      - name: Check for dataset or config changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain data/ src/pipeline/config/drivers_dob.json)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update Pull Request (Human-in-the-Loop review)
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-openf1-data
          commit-message: "chore(data): sync latest OpenF1 race datasets"
          title: "chore(data): update F1 datasets from OpenF1"
          body-path: /tmp/sync_summary.md
          add-paths: |
            data/
            src/pipeline/config/drivers_dob.json
          delete-branch: true
